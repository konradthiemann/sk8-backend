# Browser-side protection only (ADR-006): the allowed origins are the frontend URLs
# of the current environment, configured via CORS_ALLOW_ORIGIN.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'X-Api-Key']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/': null
