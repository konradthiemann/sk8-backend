doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # The server version is part of DATABASE_URL (serverVersion=16), see .env
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        # camelCase properties -> snake_case columns (sessionId -> session_id), ADR-008
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

# The test database is selected explicitly via DATABASE_URL in .env.test
# (sk8_backend_test); no automatic "_test" suffix is appended.

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
